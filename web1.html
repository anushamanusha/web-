<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile Card Generator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: linear-gradient(135deg,#2b5876,#4e4376); min-height: 100vh;}
    .glass { backdrop-filter: blur(15px); background: rgba(255,255,255,.15); border-radius:20px; }
    #cardPreview { width:260px; padding:25px; color:white; text-align:center;}
    img { width:100px; height:100px; border-radius:50%; border:2px solid white; }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center">
<div class="container p-4 text-white">
  <h2 class="text-center mb-3">AI-Style Profile Card Generator</h2>
  <div class="row g-4 justify-content-center">
    
    <div class="col-md-4">
      <input class="form-control mb-2" placeholder="Enter Name" id="name">
      <input class="form-control mb-2" placeholder="Enter Role" id="role">
      <input class="form-control mb-2" placeholder="Profile Image URL" id="photo">
      <button class="btn btn-light w-100" onclick="updateCard()">Preview</button>
      <button class="btn btn-success w-100 mt-2" onclick="downloadCard()">Download</button>
    </div>

    <div class="col-md-4 d-flex justify-content-center">
      <div id="cardPreview" class="glass">
        <img id="imgPreview" src="">
        <h4 id="namePreview">Your Name</h4>
        <p id="rolePreview">Role</p>
      </div>
    </div>

  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
function updateCard(){
  document.getElementById('imgPreview').src = document.getElementById('photo').value;
  document.getElementById('namePreview').innerText = document.getElementById('name').value;
  document.getElementById('rolePreview').innerText = document.getElementById('role').value;
}
function downloadCard(){
  html2canvas(document.querySelector("#cardPreview")).then(canvas=>{
    const link = document.createElement("a");
    link.download = "profile-card.png";
    link.href = canvas.toDataURL();
    link.click();
  });
}
</script>
</body>
</html>
